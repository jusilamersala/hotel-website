<div class="reset-container">
  <div class="reset-box">

    <h2>Ndrysho Fjalëkalimin</h2>
    <p class="subtitle">Vendosni email-in tuaj dhe fjalëkalimin e ri</p>

    <form (ngSubmit)="onSubmit()">

      <div class="form-group">
        <input
          type="email"
          [(ngModel)]="formData.email"
          name="email"
          placeholder="Email-i juaj"
          required>
      </div>

      <div class="form-group">
        <input
          type="password"
          [(ngModel)]="formData.new_password"
          name="new_password"
          placeholder="Fjalëkalimi i ri"
          required>
      </div>

      <div class="form-group">
        <input
          type="password"
          [(ngModel)]="formData.confirm"
          name="confirm"
          placeholder="Konfirmo fjalëkalimin"
          required>
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        {{ isLoading ? 'Duke u procesuar...' : 'Ndrysho Fjalëkalimin' }}
      </button>

      <a class="back-link" routerLink="/login">← Kthehu te Kyçja</a>

    </form>
  </div>
</div>

<!-- MODAL SUKSESI -->
<div class="modal-overlay" *ngIf="showSuccessModal">
  <div class="modal-box">
    <h2>Fjalëkalimi u Ndryshua!</h2>
    <p>Fjalëkalimi juaj u përditësua me sukses. Tani mund të kyçeni.</p>
    <button class="btn-ok" (click)="goToLogin()">Shko te Hyr</button>
  </div>
</div>

<!-- MODAL GABIMI -->
<div class="modal-overlay" *ngIf="showErrorModal" (click)="closeErrorModal()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="closeErrorModal()">✕</button>
    <h2>Gabim!</h2>
    <p>{{ errorMessage }}</p>
    <button class="btn-error" (click)="closeErrorModal()">Provo Përsëri</button>
  </div>
</div>
