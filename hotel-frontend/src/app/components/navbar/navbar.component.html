<nav
  class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-3 main-nav"
>
  <div class="container-fluid px-5">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
      <i class="bi bi-buildings-fill text-gold fs-3"></i>
      <div class="logo-text">
        <span class="fw-bold text-uppercase d-block lh-1">Grand Horizon</span>
        <small class="text-gold fw-light ls-2">Luxury Hotel</small>
      </div>
    </a>

    <button
      #hotelToggler
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#hotelNav"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="hotelNav">
      <ul class="navbar-nav ms-auto align-items-center gap-3">
        <li class="nav-item">
          <a
            class="nav-link px-3"
            routerLink="/"
            routerLinkActive="active"
            (click)="hotelToggler.click()"
            >Kryefaqja</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link px-3"
            routerLink="/about"
            routerLinkActive="active"
            (click)="hotelToggler.click()"
            >Rreth Nesh</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link px-3"
            routerLink="/rooms"
            routerLinkActive="active"
            (click)="hotelToggler.click()"
            >Dhomat</a
          >
        </li>
        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle px-3"
            href="#"
            role="button"
            data-bs-toggle="dropdown"
            >Spa & Wellness</a
          >
          <ul class="dropdown-menu dropdown-menu-dark shadow-lg border-gold">
            <li *ngFor="let service of spaServices">
              <a
                class="dropdown-item"
                [routerLink]="['/spa']"
                [queryParams]="{ id: service.service_ID }"
                (click)="hotelToggler.click()"
              >
                {{ service.service_Name }}
              </a>
            </li>

          </ul>
        </li>
        <li class="nav-item">
          <a
            class="nav-link px-3"
            routerLink="/contact"
            routerLinkActive="active"
            (click)="hotelToggler.click()"
            >Kontakt</a
          >
        </li>

        <li class="nav-item ms-lg-3" *ngIf="!isLoggedIn">
          <a
            class="btn btn-gold rounded-pill px-4 fw-bold shadow-sm"
            routerLink="/login"
            (click)="hotelToggler.click()"
          >
            <i class="bi bi-person-circle me-1"></i> Hyr
          </a>
        </li>

        <li class="nav-item dropdown ms-lg-3" *ngIf="isLoggedIn">
          <a
            class="btn btn-gold rounded-pill px-4 fw-bold shadow-sm dropdown-toggle"
            href="#"
            role="button"
            data-bs-toggle="dropdown"
          >
            <!-- Iniciali në rreth -->
            <span class="bi bi-person me-2"></span>{{ userName }}
          </a>
          <ul
            class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow-lg"
          >
            <li>
              <a
                class="dropdown-item"
                href="#"
                (click)="navigateToProfile(); hotelToggler.click(); $event.preventDefault()"
              >
                <i class="bi bi-person me-2"></i> Profili Im
              </a>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <button class="dropdown-item text-danger" (click)="logout()">
                <i class="bi bi-box-arrow-right me-2"></i> Dil
              </button>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
