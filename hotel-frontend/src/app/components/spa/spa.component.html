<div class="container my-5 text-center">
  <h1 class="fw-bold mb-4">Spa & Wellness</h1>

  <div *ngIf="selectedService">
    <div class="card mx-auto shadow-sm p-4" style="max-width: 600px">
      <i
        class="bi fs-1 text-gold mb-3"
        [ngClass]="{
          'bi-water': selectedService.service_Name.includes('Pishina'),
          'bi-hand-thumbs-up': selectedService.service_Name.includes('Masazhe'),
          'bi-dumbbell': selectedService.service_Name.includes('Palestër'),
          'bi-stars':
            !selectedService.service_Name.includes('Pishina') &&
            !selectedService.service_Name.includes('Masazhe'),
        }"
      >
      </i>

      <h3 class="fw-bold">{{ selectedService.service_Name }}</h3>

      <p>{{ selectedService.service_Description }}</p>

      <div class="mt-3">
        <span
          *ngIf="selectedService.is_Included == 1"
          class="badge bg-success px-3 py-2"
        >
          I përfshirë në qëndrim
        </span>
        <span
          *ngIf="selectedService.is_Included == 0"
          class="fw-bold text-gold fs-5"
        >
          Çmimi: {{ selectedService.service_Price }}€
        </span>
      </div>
    </div>
  </div>

  <div
    *ngIf="!selectedService && spaServices.length > 0"
    class="text-muted mt-4"
  >
    Ju lutem zgjidhni një shërbim nga menuja.
  </div>
</div>
