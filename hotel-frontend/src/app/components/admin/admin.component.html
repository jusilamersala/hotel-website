<div class="container-fluid px-2 py-4"> <h1 class="text-center mb-4 text-gold fs-2">Admin Dashboard</h1>

  <ul class="nav nav-tabs mb-4 flex-nowrap overflow-auto"> 
    <li class="nav-item">
      <a class="nav-link text-nowrap" [class.active]="activeTab === 'rooms'" (click)="setActiveTab('rooms')">Manage Rooms</a>
    </li>
    <li class="nav-item">
      <a class="nav-link text-nowrap" [class.active]="activeTab === 'staff'" (click)="setActiveTab('staff')">Manage Staff</a>
    </li>
  </ul>

  <div [ngSwitch]="activeTab">
    <div *ngSwitchCase="'rooms'" class="tab-content shadow-sm p-3">
      <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-3 gap-2">
        <h3 class="m-0">Rooms</h3>
        <button class="btn btn-gold btn-sm w-auto" (click)="addRoom()">+ Add Room</button>
      </div>

      <div class="table-responsive border-0">
        <table class="table table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>Name</th>
              <th>Type</th>
              <th>Price</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let room of rooms">
              <td class="text-nowrap fw-bold">{{ room.name }}</td>
              <td>{{ room.room_type }}</td>
              <td class="text-nowrap">{{ room.price }}€</td>
              <td>
                <div class="d-flex gap-1">
                  <button class="btn btn-sm btn-outline-primary" (click)="editRoom(room)"><i class="bi bi-pencil"></i></button>
                  <button class="btn btn-sm btn-outline-danger" (click)="deleteRoom(room.room_ID)"><i class="bi bi-trash"></i></button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
