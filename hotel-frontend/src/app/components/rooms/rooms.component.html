<section class="rooms-header d-flex align-items-center text-center text-white">
  <div class="container">
    <h1 class="display-4 fw-bold animate__animated animate__fadeIn">Dhomat & Suitat tona</h1>
    <p class="lead opacity-75">Zgjidhni komoditetin që ju përshtatet më së miri</p>
  </div>
</section>

<!-- SEKSIONI I FILTRAVE -->
<section class="py-4 bg-white border-bottom shadow-sm">
  <div class="container text-center">
    <div class="btn-group flex-wrap gap-2" role="group" aria-label="Room Filters">
      <button type="button" class="btn rounded-pill px-4 fw-bold"
              [ngClass]="selectedCategory === 'all' ? 'btn-gold' : 'btn-outline-secondary'"
              (click)="setFilter('all')">Të gjitha</button>
              
      <button type="button" class="btn rounded-pill px-4 fw-bold"
              [ngClass]="selectedCategory === 'deluxe' ? 'btn-gold' : 'btn-outline-secondary'"
              (click)="setFilter('deluxe')">Deluxe</button>
              
      <button type="button" class="btn rounded-pill px-4 fw-bold"
              [ngClass]="selectedCategory === 'suite' ? 'btn-gold' : 'btn-outline-secondary'"
              (click)="setFilter('suite')">Suite</button>
              
      <button type="button" class="btn rounded-pill px-4 fw-bold"
              [ngClass]="selectedCategory === 'standard' ? 'btn-gold' : 'btn-outline-secondary'"
              (click)="setFilter('standard')">Standard</button>
    </div>
  </div>
</section>

<!-- KARTA E DHOMAVE TË FILTRUARA -->
<section class="py-5 bg-light">
  <div class="container py-4">
    <div class="row g-4">
      
      <!-- Unaza lexon funksionin filteredRooms -->
      <div class="col-lg-4 col-md-6" *ngFor="let room of filteredRooms">
        <div class="card h-100 border-0 shadow-sm room-card animate__animated animate__fadeIn">
          <div class="position-relative overflow-hidden">
            <img [src]="room.image" class="card-img-top" [alt]="room.name">
            <div class="price-tag">{{ room.price }}€ / Natë</div>
          </div>
          <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="fw-bold mb-0">{{ room.name }}</h5>
              <div class="stars text-gold" *ngIf="room.category === 'deluxe' || room.category === 'suite'">
                <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i>
              </div>
            </div>
            <p class="text-muted small">{{ room.description }}</p>
            
            <!-- Karakteristikat e dhomës në mënyrë dinamike -->
            <div class="room-features d-flex gap-3 mb-4 py-3 border-top border-bottom">
              <span *ngFor="let feature of room.features">
                <i class="bi {{ feature.icon }} text-gold me-1"></i> {{ feature.label }}
              </span>
            </div>
            
            <div class="d-flex justify-content-between align-items-center">
              <span class="fw-bold text-secondary"><i class="bi bi-people me-1"></i> {{ room.guests }} Persona</span>
              <button class="btn btn-gold px-4 rounded-pill fw-bold">Rezervo</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Nëse nuk ka asnjë dhomë në atë kategori -->
      <div class="col-12 text-center py-5" *ngIf="filteredRooms.length === 0">
        <h4 class="text-muted">Nuk u gjet asnjë dhomë për këtë kategori.</h4>
      </div>

    </div>
  </div>
</section>
