<div class="container-fluid py-4 px-md-5"> <h1 class="text-center mb-4 text-gold fs-2">Receptionist Dashboard</h1>

  <div class="card border-0 shadow-sm">
    <div class="card-header bg-gold text-white p-3">
      <h3 class="m-0 fs-4">Manage Bookings</h3>
    </div>
    <div class="card-body p-0"> <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="ps-3">ID</th>
              <th>User</th>
              <th>Room</th>
              <th>Check-in</th>
              <th>Check-out</th>
              <th>Status</th>
              <th class="pe-3">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let booking of bookings">
              <td class="ps-3 fw-bold">#{{ booking.booking_ID }}</td>
              <td class="text-nowrap">{{ booking.name }} {{ booking.surname }}</td>
              <td class="text-nowrap">{{ booking.room_name }}</td>
              <td class="text-nowrap">{{ booking.check_In_Date }}</td>
              <td class="text-nowrap">{{ booking.check_Out_Date }}</td>
              <td>
                <span class="badge rounded-pill p-2 d-block" [ngClass]="{
                  'bg-warning text-dark': booking.status === 'Pending',
                  'bg-success': booking.status === 'Confirmed',
                  'bg-danger': booking.status === 'Cancelled'
                }">{{ booking.status }}</span>
              </td>
              <td class="pe-3">
                <div class="d-flex flex-column flex-xl-row gap-2">
                  <select class="form-select form-select-sm" 
                          [value]="booking.status" 
                          (change)="updateBookingStatus(booking.booking_ID, $event)">
                    <option value="Pending">Pending</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="Cancelled">Cancelled</option>
                  </select>
                  <button class="btn btn-sm btn-outline-danger" (click)="deleteBooking(booking.booking_ID)">
                    <i class="bi bi-trash"></i> </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
    </div>
  </div>
</div>
